<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AfterClass</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    .lesson img { width: 300px; height: auto; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="app">
    <h1>AfterClass</h1>
    <button v-on:click="toggleCart" v-bind:disabled="numberOfItems === 0">
      Checkout ({{ numberOfItems }})
    </button>
    <div v-if="!displayCart" class="lesson">
      <img :src="lesson.image" :alt="lesson.alt">
      <h2>{{ lesson.subject }}</h2>
      <p>Location: {{ lesson.location }}</p>
      <p>Price: £{{ lesson.price }}</p>
      <p>Spaces: {{ lesson.availability }}</p>
      <button v-on:click="addToCart" v-bind:disabled="!canAddToCart">Add to Cart</button>
    </div>
    <div v-else>
      <h2>Checkout</h2>
    </div>
  </div>

  <script>
    const { createApp } = Vue
    createApp({
      data() {
        return {
          cart: [],
          displayCart: false,
          lesson: {
            id: 1001,
            availability: 5,
            subject: 'Computer Science',
            location: 'Hendon',
            price: 120,
            image: 'images/computerScience.svg',
            alt: 'A computer screen showing code'
          }
        }
      },
      methods: {
        toggleCart() {
          this.displayCart = !this.displayCart
        },
        addToCart() {
          if (this.canAddToCart) {
            this.cart.push(this.lesson.id)
            this.lesson.availability--
          }
        }
      },
      computed: {
        numberOfItems() {
          return this.cart.length
        },
        canAddToCart() {
          return this.lesson.availability > 0
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
