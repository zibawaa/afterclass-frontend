<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AfterClass</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    .cart-item { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
    .order-form { display: flex; flex-direction: column; gap: 0.5rem; max-width: 300px; }
    .confirmation { color: green; font-weight: bold; }
    .sort-controls { display: flex; gap: 1rem; margin: 1rem 0; }
    .lessons { display: flex; flex-wrap: wrap; gap: 1.5rem; }
    .lesson { width: 260px; }
    .lesson img { width: 100%; height: auto; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="app">
    <h1>AfterClass</h1>
    <button v-on:click="toggleCart" v-bind:disabled="numberOfItems === 0 && !displayCart">
      Cart ({{ numberOfItems }})
    </button>
    <div v-if="!displayCart">
    <div class="sort-controls">
      <label>Sort by:
        <select v-model="sortType">
          <option value="price">Price</option>
          <option value="availability">Spaces</option>
          <option value="location">Location</option>
          <option value="subject">Subject</option>
        </select>
      </label>
      <label>Order:
        <select v-model="ascending">
          <option :value="true">Ascending</option>
          <option :value="false">Descending</option>
        </select>
      </label>
    </div>
    <div class="lessons">
      <div v-for="lesson in sortedLessons" :key="lesson.id" class="lesson">
        <img :src="baseUrl + '/' + lesson.image" :alt="lesson.alt">
        <h2>{{ lesson.subject }}</h2>
        <p>Location: {{ lesson.location }}</p>
        <p>Price: £{{ lesson.price }}</p>
        <p>Spaces: {{ lesson.availability }}</p>
        <button v-on:click="addToCart(lesson)" v-bind:disabled="!canAddToCart(lesson)">Add to Cart</button>
      </div>
    </div>
    </div>
    <div v-else>
      <h2>Checkout</h2>
      <p v-if="orderMessage" class="confirmation">{{ orderMessage }}</p>
      <div class="cart-summary">
        <template v-for="lesson in lessons" :key="lesson.id">
          <div v-if="countInCart(lesson.id) > 0" class="cart-item">
            <span>{{ lesson.subject }} ({{ lesson.location }}) x {{ countInCart(lesson.id) }}</span>
            <button v-on:click="removeFromCart(lesson)">Remove</button>
          </div>
        </template>
      </div>
      <div class="order-form">
        <label>Name: <input v-model="order.name" type="text" placeholder="Your name"></label>
        <label>Phone: <input v-model="order.phone" type="text" placeholder="Your phone number"></label>
        <button v-on:click="checkout" v-bind:disabled="!canCheckout">Checkout</button>
      </div>
    </div>
  </div>

  <script>
    const { createApp } = Vue
    createApp({
      data() {
        return {
          cart: [],
          displayCart: false,
          baseUrl: 'http://localhost:3000',
          sortType: 'price',
          ascending: true,
          orderMessage: '',
          order: { name: '', phone: '' },
          lessons: []
        }
      },
      created() {
        this.fetchData()
      },
      methods: {
        async fetchData() {
          const url = this.baseUrl + '/lessons'
          const response = await fetch(url)
          this.lessons = await response.json()
        },
        toggleCart() {
          this.displayCart = !this.displayCart
        },
        addToCart(lesson) {
          if (this.canAddToCart(lesson)) {
            this.cart.push(lesson.id)
            lesson.availability--
          }
        },
        countInCart(id) {
          return this.cart.filter(item => item === id).length
        },
        removeFromCart(lesson) {
          const index = this.cart.indexOf(lesson.id)
          if (index !== -1) {
            this.cart.splice(index, 1)
            lesson.availability++
          }
        },
        async checkout() {
          if (!this.canCheckout) return
          const newOrder = {
            name: this.order.name,
            phone: this.order.phone,
            lessonIDs: this.cart,
            spaces: this.cart.length
          }
          const response = await fetch(this.baseUrl + '/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newOrder)
          })
          if (!response.ok) {
            this.orderMessage = 'Sorry, your order could not be submitted.'
            return
          }
          this.orderMessage = 'Thank you ' + this.order.name + ', your order has been confirmed.'
          this.cart = []
          this.order = { name: '', phone: '' }
        },
        canAddToCart(lesson) {
          return lesson.availability > 0
        }
      },
      computed: {
        sortedLessons() {
          const key = this.sortType
          const direction = this.ascending ? 1 : -1
          return [...this.lessons].sort((a, b) => {
            if (typeof a[key] === 'string') {
              return a[key].localeCompare(b[key]) * direction
            }
            return (a[key] - b[key]) * direction
          })
        },
        canCheckout() {
          return this.order.name.trim() !== '' && this.order.phone.trim() !== ''
        },
        numberOfItems() {
          return this.cart.length
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
