<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AfterClass</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    .cart-item { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
    .order-form { display: flex; flex-direction: column; gap: 0.5rem; max-width: 300px; }
    .confirmation { color: green; font-weight: bold; }
    .lessons { display: flex; flex-wrap: wrap; gap: 1.5rem; }
    .lesson { width: 260px; }
    .lesson img { width: 100%; height: auto; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="app">
    <h1>AfterClass</h1>
    <button v-on:click="toggleCart" v-bind:disabled="numberOfItems === 0 && !displayCart">
      Cart ({{ numberOfItems }})
    </button>
    <div v-if="!displayCart" class="lessons">
      <div v-for="lesson in lessons" :key="lesson.id" class="lesson">
        <img :src="lesson.image" :alt="lesson.alt">
        <h2>{{ lesson.subject }}</h2>
        <p>Location: {{ lesson.location }}</p>
        <p>Price: £{{ lesson.price }}</p>
        <p>Spaces: {{ lesson.availability }}</p>
        <button v-on:click="addToCart(lesson)" v-bind:disabled="!canAddToCart(lesson)">Add to Cart</button>
      </div>
    </div>
    <div v-else>
      <h2>Checkout</h2>
      <p v-if="orderMessage" class="confirmation">{{ orderMessage }}</p>
      <div class="cart-summary">
        <template v-for="lesson in lessons" :key="lesson.id">
          <div v-if="countInCart(lesson.id) > 0" class="cart-item">
            <span>{{ lesson.subject }} ({{ lesson.location }}) x {{ countInCart(lesson.id) }}</span>
            <button v-on:click="removeFromCart(lesson)">Remove</button>
          </div>
        </template>
      </div>
      <div class="order-form">
        <label>Name: <input v-model="order.name" type="text" placeholder="Your name"></label>
        <label>Phone: <input v-model="order.phone" type="text" placeholder="Your phone number"></label>
        <button v-on:click="checkout" v-bind:disabled="!canCheckout">Checkout</button>
      </div>
    </div>
  </div>

  <script>
    const { createApp } = Vue
    createApp({
      data() {
        return {
          cart: [],
          displayCart: false,
          orderMessage: '',
          order: { name: '', phone: '' },
          lessons: [
            { id: 1001, subject: 'Computer Science', location: 'Hendon', price: 120, availability: 5,
              image: 'images/computerScience.svg', alt: 'A computer screen showing code' },
            { id: 1002, subject: 'Maths', location: 'Colindale', price: 80, availability: 5,
              image: 'images/math.svg', alt: 'Maths sigma symbol' },
            { id: 1003, subject: 'Art', location: 'Brent Cross', price: 90, availability: 5,
              image: 'images/art.svg', alt: 'A pencil for art class' },
            { id: 1004, subject: 'Music', location: 'Golders Green', price: 95, availability: 5,
              image: 'images/music.svg', alt: 'A musical note' }
          ]
        }
      },
      methods: {
        toggleCart() {
          this.displayCart = !this.displayCart
        },
        addToCart(lesson) {
          if (this.canAddToCart(lesson)) {
            this.cart.push(lesson.id)
            lesson.availability--
          }
        },
        countInCart(id) {
          return this.cart.filter(item => item === id).length
        },
        removeFromCart(lesson) {
          const index = this.cart.indexOf(lesson.id)
          if (index !== -1) {
            this.cart.splice(index, 1)
            lesson.availability++
          }
        },
        checkout() {
          if (!this.canCheckout) return
          this.orderMessage = 'Thank you ' + this.order.name + ', your order has been confirmed.'
          this.cart = []
          this.order = { name: '', phone: '' }
        },
        canAddToCart(lesson) {
          return lesson.availability > 0
        }
      },
      computed: {
        canCheckout() {
          return this.order.name.trim() !== '' && this.order.phone.trim() !== ''
        },
        numberOfItems() {
          return this.cart.length
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
