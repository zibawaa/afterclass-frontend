<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AfterClass</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    .lesson img { width: 300px; height: auto; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="app">
    <h1>AfterClass</h1>
    <div class="lesson">
      <img :src="lesson.image" :alt="lesson.alt">
      <h2>{{ lesson.subject }}</h2>
      <p>Location: {{ lesson.location }}</p>
      <p>Price: £{{ lesson.price }}</p>
    </div>
  </div>

  <script>
    const { createApp } = Vue
    createApp({
      data() {
        return {
          lesson: {
            subject: 'Computer Science',
            location: 'Hendon',
            price: 100,
            image: 'images/computerScience.svg',
            alt: 'A computer screen showing code'
          }
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
